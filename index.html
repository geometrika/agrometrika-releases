<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Версии моб. приложения Agrometrika</title>
</head>
<body>

    <h1>Скачать приложение Agrometrika</h1>
    
    <!-- This button starts disabled and will update automatically -->
    <a id="download-btn" href="#" style="padding: 10px 20px; background: green; color: white; text-decoration: none; display: inline-block;">
        Loading latest version...
    </a>

    <script>
        const OWNER = "geometrika";
        const REPO = "agrometrika-releases";

        async function fetchLatestRelease() {
            try {
                const response = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/releases/latest`);
                if (!response.ok) throw new Error("Failed to fetch release");
                
                const data = await response.json();
                
                // Find the asset that ends with .apk
                const apkAsset = data.assets.find(asset => asset.name.endsWith('.apk'));
                
                if (apkAsset) {
                    const btn = document.getElementById('download-btn');
                    btn.href = apkAsset.browser_download_url;
                    // Dynamically displays "Download agrometrika-1.0.2.apk"
                    btn.innerText = `Download ${apkAsset.name}`; 
                }
            } catch (error) {
                console.error(error);
                document.getElementById('download-btn').innerText = "Download (GitHub Releases)";
                document.getElementById('download-btn').href = `https://github.com{OWNER}/${REPO}/releases`;
            }
        }

        fetchLatestRelease();
    </script>
</body>
</html>
